<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎭 Random Joke Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        select {
            padding: 10px 15px;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            background-color: white;
            color: #333;
        }

        button {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .joke-container {
            background: #f8f9ff;
            border-left: 4px solid #667eea;
            border-radius: 8px;
            padding: 25px;
            margin: 20px 0;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .joke-text {
            font-size: 1.2em;
            color: #333;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .punchline {
            font-size: 1.1em;
            color: #764ba2;
            font-weight: bold;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid #ddd;
        }

        .category-badge {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.9em;
            margin-top: 10px;
        }

        .loading {
            text-align: center;
            color: #667eea;
            font-size: 1.1em;
        }

        .error {
            background: #ffe0e0;
            border-left: 4px solid #ff6b6b;
            color: #c92a2a;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .stats {
            text-align: center;
            color: #666;
            font-size: 0.9em;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 2em;
            }

            .controls {
                flex-direction: column;
            }

            select, button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎭 Joke Generator</h1>
        <p class="subtitle">Get a random laugh!</p>

        <div class="controls">
            <select id="category">
                <option value="Any">Any Category</option>
                <option value="General">General</option>
                <option value="Programming">Programming</option>
                <option value="Knock-Knock">Knock-Knock</option>
                <option value="Dark">Dark</option>
                <option value="Spooky">Spooky</option>
            </select>
            <button id="getJokeBtn" onclick="getJoke()">Get Joke</button>
            <button id="getMultipleBtn" onclick="getMultipleJokes()">Get 3 Jokes</button>
        </div>

        <div id="jokeDisplay"></div>
        <div class="stats">
            <p>Jokes fetched: <span id="jokeCount">0</span></p>
        </div>
    </div>

    <script>
        let jokeCount = 0;
        const API_URL = 'https://v2.jokeapi.dev/joke';

        async function fetchJoke(category = 'Any') {
            try {
                const response = await fetch(`${API_URL}/${category}`);
                if (!response.ok) throw new Error('Failed to fetch joke');
                return await response.json();
            } catch (error) {
                throw new Error(`Error: ${error.message}`);
            }
        }

        function displayJoke(joke) {
            const container = document.getElementById('jokeDisplay');
            let jokeHTML = '<div class="joke-container">';

            if (joke.type === 'single') {
                jokeHTML += `<div class="joke-text">${escapeHtml(joke.joke)}</div>`;
            } else {
                jokeHTML += `<div class="joke-text">Setup: ${escapeHtml(joke.setup)}</div>`;
                jokeHTML += `<div class="punchline">Punchline: ${escapeHtml(joke.delivery)}</div>`;
            }

            jokeHTML += `<span class="category-badge">${joke.category}</span>`;
            jokeHTML += '</div>';

            container.innerHTML = jokeHTML;
            jokeCount++;
            document.getElementById('jokeCount').textContent = jokeCount;
        }

        function showError(message) {
            document.getElementById('jokeDisplay').innerHTML = `<div class="error">❌ ${escapeHtml(message)}</div>`;
        }

        function showLoading() {
            document.getElementById('jokeDisplay').innerHTML = '<div class="loading">⏳ Loading...</div>';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function getJoke() {
            const category = document.getElementById('category').value;
            const btn = document.getElementById('getJokeBtn');
            btn.disabled = true;

            showLoading();
            try {
                const joke = await fetchJoke(category);
                displayJoke(joke);
            } catch (error) {
                showError(error.message);
            } finally {
                btn.disabled = false;
            }
        }

        async function getMultipleJokes() {
            const category = document.getElementById('category').value;
            const btn = document.getElementById('getMultipleBtn');
            btn.disabled = true;

            showLoading();
            try {
                const jokes = await Promise.all([
                    fetchJoke(category),
                    fetchJoke(category),
                    fetchJoke(category)
                ]);

                let html = '';
                jokes.forEach((joke, index) => {
                    html += '<div class="joke-container">';
                    html += `<div style="color: #667eea; font-weight: bold; margin-bottom: 10px;">Joke ${index + 1}</div>`;

                    if (joke.type === 'single') {
                        html += `<div class="joke-text">${escapeHtml(joke.joke)}</div>`;
                    } else {
                        html += `<div class="joke-text">Setup: ${escapeHtml(joke.setup)}</div>`;
                        html += `<div class="punchline">Punchline: ${escapeHtml(joke.delivery)}</div>`;
                    }

                    html += `<span class="category-badge">${joke.category}</span>`;
                    html += '</div>';

                    jokeCount++;
                });

                document.getElementById('jokeDisplay').innerHTML = html;
                document.getElementById('jokeCount').textContent = jokeCount;
            } catch (error) {
                showError(error.message);
            } finally {
                btn.disabled = false;
            }
        }

        // Load a joke on page load
        window.addEventListener('load', getJoke);
    </script>
</body>
</html>
